plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url 'https://maven.sinytra.org/'
    }
}

dependencies {
    neoForge("net.neoforged:neoforge:${neoforge_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-neoforge:0.4.1"))

    modImplementation(include("io.github.mortuusars.mortaar:mortaar-${minecraft_version}-neoforge:${mortaar_version}"))

    // Integration
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    modCompileOnlyApi("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    modCompileOnlyApi("dev.latvian.mods:better-advanced-tooltips:${kjs_better_adv_tooltips_version}") { transitive = false }
    modCompileOnlyApi("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    modLocalRuntime("curse.maven:embeddium-908741:6118392")
    modLocalRuntime("curse.maven:jade-324717:${jade_neoforge_id}")
    modLocalRuntime("curse.maven:yeetusexperimentus-635427:5444189")

    // Mods for testing/compat

    // modLocalRuntime("maven.modrinth:puzzles-lib:${puzzles_lib_modrinth_neoforge_version}")
    // modLocalRuntime("maven.modrinth:easy-anvils:${easy_anvils_modrinth_neoforge_version}")
    // modLocalRuntime("maven.modrinth:cloth-config:15.0.140+neoforge")
    // modLocalRuntime("maven.modrinth:renderscale:1.4.0-alpha.6-neoforge+1.21.1")
    // modLocalRuntime("maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_modrinth_neoforge_version}")
    // modLocalRuntime("maven.modrinth:essentialsmod:y6XzoYMQ")
    // modLocalRuntime("maven.modrinth:crossroads:EgSYNn26")
    // modLocalRuntime("maven.modrinth:refined-storage:lHHiI26k")

    // FTB Chunks
    // modLocalRuntime("curse.maven:architectury-api-419699:8492726")
    // modLocalRuntime("curse.maven:ftb-library-forge-404465:9350706")
    // modLocalRuntime("curse.maven:ftb-teams-forge-404468:9434081")
    // modLocalRuntime("curse.maven:ftb-chunks-forge-314906:9374151")

    // KubeJS
    // modLocalRuntime("dev.latvian.mods:rhino:${rhino_version}")
    // modLocalRuntime("dev.latvian.mods:better-advanced-tooltips:${kjs_better_adv_tooltips_version}")
    // modLocalRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    // Create
    // modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    // modImplementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    // modCompileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    // modLocalRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    // modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

loom {
    accessWidenerPath.set(project(":common").loom.accessWidenerPath)

    runs {
        create("client2") {
            inherit(getByName("client"))

            name("Second Client")
            programArgs("--username", "AnotherDev")

            client()
        }
    }
}

shadowJar {
    exclude("architectury.common.json")
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}