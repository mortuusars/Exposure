    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

loom {
    runs {

        data {
            data()
            programArgs "--all", "--mod", "${mod_id}"
            programArgs "--output", project(':common').file("src/generated").absolutePath // Outputs to common project
            programArgs "--existing", project(':common').file("src/main/resources").absolutePath // Makes datagen see resources from common folder
        }

        exportClient {
            client()
            property('wiki_exporter.enabled', 'true')
        }
        exportServer {
            server()
            programArgs('nogui')
            property('wiki_exporter.enabled', 'true')
        }
    }
}

shadowJar {
    exclude("architectury.common.json")
    exclude("hotswap-agent.properties")
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    inputFile.set shadowJar.archiveFile
}
