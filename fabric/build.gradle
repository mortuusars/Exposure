plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

repositories {
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
    maven { url = "https://mvn.devos.one/snapshots/" } // Create Fabric, Forge Tags, Milk Lib, Registrate Fabric
    maven { url = "https://mvn.devos.one/releases" } // Porting Lib Releases
    maven { url = "https://maven.cafeteria.dev/releases" } // Fake Player API
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url = "https://jitpack.io/" }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    } // Forge Config API Port
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    modImplementation(include("io.github.mortuusars.mortaar:mortaar-${minecraft_version}-fabric:${mortaar_version}"))
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")

    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

    modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    modLocalRuntime("maven.modrinth:modmenu:YIfqIJ8q")
    modLocalRuntime("maven.modrinth:jade:15.10.6+fabric")
    modLocalRuntime("maven.modrinth:yeetus-experimentus:b7C4gGUr")

    modLocalRuntime("maven.modrinth:sodium:mc1.21.1-0.8.13-fabric")
    modLocalRuntime("maven.modrinth:iris:1.8.14-beta.1+1.21.1-fabric")
    // These three are needed for iris to work properly:
    modLocalRuntime('org.anarres:jcpp:1.4.14')
    modLocalRuntime('org.antlr:antlr4-runtime:4.13.1')
    modLocalRuntime("io.github.douira:glsl-transformer:3.0.0-pre3")

    modLocalRuntime("maven.modrinth:distanthorizons:9w34y8ai")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}
