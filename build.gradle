plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = "${minecraft_version}-${mod_version}-port.2"
group = maven_group
base.archivesName = 'exposure-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.creeperhost.net/' }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
}

sourceSets.main {
    java.srcDirs 'common/src/main/java', 'neoforge/src/main/java'
    resources.srcDirs 'common/src/main/resources', 'neoforge/src/main/resources'
    java.exclude '**/integration/kubejs/**', '**/integration/jei/**', '**/mixin/KubeJSGameClientEventHandlerMixin.java'
    resources.exclude 'architectury.common.json', 'exposure.accesswidener', 'kubejs.plugins.txt'
}

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {}
    server {
        argument '--nogui'
    }
}

tasks.named('processResources', ProcessResources) {
    def keys = ['mod_id', 'mod_name', 'mod_license', 'mod_authors', 'mod_description', 'mod_issues',
                'mod_page', 'minecraft_version_range', 'neoforge_version_range', 'neoforge_loader_version_range',
                'create_version_range', 'create_version_range_reason']
    def metadata = keys.collectEntries { [(it): project.property(it)] } + [mod_version: project.version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

tasks.named('jar', Jar) {
    from 'LICENSE.md'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
